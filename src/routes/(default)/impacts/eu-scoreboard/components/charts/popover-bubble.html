<div class="flex flex-col items-start content-stretch justify-items-start justify-stretch gap-y-1 py-1">
  <span class="font-bold">{{label}}</span>
  <div class="w-full flex gap-4 items-baseline justify-between">
    <span class="text-contour-weak">{{xLabel}}</span>
    <span class="font-bold">{{formattedX}}</span>
  </div>
  <div class="w-full flex gap-4 items-baseline justify-between">
    <span class="text-contour-weak">{{yLabel}}</span>
    <span class="font-bold">{{formattedY}}</span>
  </div>
  <div class="w-full font-normal border-t border-contour-weakest flex justify-between gap-4 items-baseline pt-2 mt-1 text-contour-weak text-sm">
    <span class="leading-tight">{{sizeLabel}}</span>
    <span>{{formattedSize}}</span>
  </div>
</div>
