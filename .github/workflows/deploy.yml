name: deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Deploy Production

    runs-on: ubuntu-latest

    permissions:
      deployments: write
      contents: read

    steps:
      - uses: actions/checkout@v1

      - uses: chrnorm/deployment-action@v2
        name: Create GitHub deployment
        id: deployment
        with:
          token: "${{ github.token }}"
          environment: iiasa-production
